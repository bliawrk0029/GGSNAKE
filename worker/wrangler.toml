name = "ggsnake-api"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "ggsnake"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
APP_URL = "https://bliawrk0029.github.io/GGSNAKE/"
ALLOWED_ORIGIN = "https://bliawrk0029.github.io"
BOT_USERNAME = "ggsnake_game_bot"
APP_SHORT_NAME = "play"
# Contest settings (UTC). Change the end date before launch.
CONTEST_END = "2026-10-31T18:00:00Z"
PRIZE_POOL = "1000"
PRIZE_CURRENCY = "USDT"
PRIZES_SCORE = "300,150,75,40,35"
PRIZES_REF = "200,100,50,25,25"
# Friend points: counted after 5 ranked games on 2 different days (+1),
# loyal when they play on day 7 (+1), friend of a friend counted (+0.5).
REF_MIN_GAMES = "5"
REF_MIN_DAYS = "2"
REF_LOYAL_DAY = "7"
REF_HOLD_HOURS = "24"
REF_DAILY_CAP = "15"
REF_OWNER_MIN_GAMES = "5"
MAX_GAMES_PER_DAY = "500"
# Bot look: welcome picture, official channel (without @), support contact
WELCOME_IMAGE = "https://bliawrk0029.github.io/GGSNAKE/brand/post.png"
CHANNEL_USERNAME = ""
SUPPORT_CONTACT = ""
INITDATA_MAX_AGE = "86400"

# Secrets — set in the Cloudflare dashboard (Settings → Variables and Secrets), never in this file:
#   BOT_TOKEN       token from @BotFather
#   ADMIN_KEY       long random string for /admin/* endpoints
#   WEBHOOK_SECRET  random string Telegram sends with every bot update
